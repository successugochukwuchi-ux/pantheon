<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A comprehensive study app for university students featuring lecture notes, past questions, CBT practice, and the FLUX extracurricular wing for skill tracks, clubs, and global competitions." />
    <title>CoLearn</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
      window.addEventListener('error', function(event) {
        console.error('[COLEARN INIT ERROR]', event.error || event.message);
        var root = document.getElementById('root');
        if (root && (!root.children || root.children.length === 0 || root.innerText.indexOf('Loading') !== -1)) {
          root.innerHTML = '<div style="min-h-screen; height:100vh; background:#09090b; color:#f4f4f5; display:flex; flex-direction:column; align-items:center; justify-center; justify-content:center; padding:2rem; text-align:center; font-family:sans-serif;"><div style="max-width:500px; background:#18181b; border:1px solid #27272a; padding:2rem; border-radius:1rem; box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);"><h1 style="color:#ef4444; font-size:1.25rem; font-weight:700; margin-bottom:0.75rem;">Application Startup Error</h1><p style="color:#a1a1aa; font-size:0.875rem; margin-bottom:1rem;">CoLearn encountered an error during initialization:</p><pre style="background:#09090b; color:#f87171; padding:0.75rem; border-radius:0.5rem; font-size:0.75rem; text-align:left; overflow-x:auto; margin-bottom:1rem;">' + (event.error && event.error.stack ? event.error.stack : event.message || 'Unknown initialization error') + '</pre><button onclick="window.location.reload()" style="background:#059669; color:white; border:none; padding:0.6rem 1.25rem; border-radius:0.5rem; font-weight:600; cursor:pointer;">Reload Page</button></div></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(event) {
        var reasonStr = (event.reason && (event.reason.message || event.reason.toString())) || '';
        if (reasonStr.indexOf('WebSocket') !== -1 || reasonStr.indexOf('vite') !== -1) {
          event.preventDefault();
          return;
        }
        console.error('[COLEARN UNHANDLED REJECTION]', event.reason);
      });
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
